name: Feature Request
description: Suggest a new Coding Agent integration, sink channel, or CLI improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use Case / Problem
      description: What workflow or pain point would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Design
      description: Describe how you envision the CLI command, adapter, or output format working.
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Core Principles Alignment
      options:
        - label: Non-blocking / passive observation (never slows down or gates agent turns)
        - label: Works without mandatory background daemons
